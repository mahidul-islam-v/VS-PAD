<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
       .logo img {
        width: 40px;
        height: 40px;
       }
       a {
        text-decoration: none;
        color: grey;
        padding-right: 15px;
        position: relative;
        transition: all 0.0625s ease 0.125s;
        top: 0;
        right: 0;
       }
       a:hover{
        top: -2px;
        right: -1px;
        transition: 0.125s ease 0s;
       }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="left">
            <a href="#" class="logo"><img src="#" alt=""></a>
        </div>

        <div class="right">
            <a href="#">Home</a>
            <a href="#">Pricing</a>
            <a href="#">Contact</a>
        </div>
    </nav>
    <hr>
</body>
</html>
